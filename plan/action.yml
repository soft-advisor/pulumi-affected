name: pulumi-affected plan
description: Preview the Pulumi stacks a change affects with --save-plan, keeping the plans that would change something
author: soft-advisor
branding:
  icon: clipboard
  color: purple

# Pulumi and cloud sign-in happen before this step, in the workflow. Plans are made with the
# checked-out code; `apply` only applies them to exactly that code (the same git tree). A selected
# stack that doesn't exist yet is created, empty, so it can be planned.

inputs:
  base:
    description: >-
      Revision to compare against. Default: the merge base with the pull request's base branch,
      or the previous commit of a push.
    required: false
  bases:
    description: >-
      JSON object mapping stack ids to the revision each was last deployed from (null: never
      deployed); those stacks compare against it instead of base.
    required: false
  run:
    description: Stack patterns to plan regardless of changes, separated by commas or newlines.
    required: false
  skip:
    description: Stack patterns to leave out unless also requested, separated by commas or newlines.
    required: false
  all:
    description: Plan every stack.
    required: false
    default: 'false'
  working-directory:
    description: 'A folder inside the repository. Default: the workspace.'
    required: false
  directory:
    description: Where to write the plans, their previews, manifest.json and comment.md.
    required: false
    default: pulumi-plans
  command:
    description: >-
      How to run Pulumi for a stack, as words with {dir}, {stack}, {project} and {id}
      placeholders, run without a shell; Pulumi's arguments are appended. A wrapper script that
      picks a backend or credentials per stack goes here.
    required: false
    default: pulumi --cwd {dir} --stack {stack}
  concurrency:
    description: How many stacks to preview at once.
    required: false
    default: '4'
  mode:
    description: >-
      plan: save the plans, which the apply action applies exactly (strict). preview: only
      preview, to show what the change will do; after merge, the apply action in mode up deploys
      it with pulumi up. See docs/modes.md.
    required: false
    default: plan
  output-readers:
    description: >-
      Mode preview: up (stacks that read outputs this change alters are deployed after it, with
      the new values) or warn (they're listed, to deploy later). Default: the config's
      outputReaders, else up. Only wording here; the apply action decides.
    required: false
  create-stacks:
    description: >-
      When a selected stack that doesn't exist yet is created. plan: now, empty, in the real
      backend, then planned like any other (needs a plan job that may create stacks). apply: by
      the apply action; the change that adds it must give it no resources (checked with a
      preview in a temporary local backend), so the plan job can be read-only. The config's
      createStacks and a Pulumi-Affected-Create-Stacks line in the pull request override this;
      see docs/new-stacks.md.
    required: false
    default: plan
  fail-fast:
    description: Stop at the first stack that fails to plan, instead of planning every other one.
    required: false
    default: 'false'
  upload:
    description: >-
      Upload the plan directory as an artifact for the apply action: pulumi-plans-<git tree SHA>
      in mode plan, pulumi-previews-<pull request number> in mode preview.
    required: false
    default: 'true'
  retention-days:
    description: 'Days to keep the artifact. Default: the repository setting.'
    required: false
  comment:
    description: Post the plan as a pull request comment, updated on later runs. comment.md is written either way.
    required: false
    default: 'true'
  pull-request:
    description: 'Pull request number to comment on. Default: the triggering pull request.'
    required: false
  github-token:
    description: Token for commenting; needs pull-requests write.
    required: false
    default: ${{ github.token }}

outputs:
  directory:
    description: Absolute path of the plan directory.
    value: ${{ steps.plan.outputs.directory }}
  artifact:
    description: The artifact name, pulumi-plans-<git tree SHA> (mode plan) or pulumi-previews-<pull request number> (mode preview).
    value: ${{ steps.plan.outputs.artifact }}
  tree:
    description: The git tree SHA that was planned.
    value: ${{ steps.plan.outputs.tree }}
  any:
    description: "'true' when at least one plan would change something."
    value: ${{ steps.plan.outputs.any }}
  ids:
    description: JSON array of the ids of the stacks with plans to apply.
    value: ${{ steps.plan.outputs.ids }}
  failed:
    description: "'true' when a stack failed to plan; the action fails after uploading and commenting."
    value: ${{ steps.plan.outputs.failed }}

runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      # exec, so a cancelled job's signal reaches node, which stops Pulumi cleanly
      run: exec node "$GITHUB_ACTION_PATH/dist/index.cjs"
      env:
        INPUT_BASE: ${{ inputs.base }}
        INPUT_BASES: ${{ inputs.bases }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_ALL: ${{ inputs.all }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_CREATE_STACKS: ${{ inputs.create-stacks }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OUTPUT_READERS: ${{ inputs.output-readers }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    # Also when the plan step failed after writing the plans
    - if: inputs.upload == 'true' && !cancelled() && steps.plan.outputs.artifact != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ steps.plan.outputs.artifact }}
        path: ${{ steps.plan.outputs.directory }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
        overwrite: true
    - if: steps.plan.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::error::A stack failed to plan; see the plan step"
        exit 1
