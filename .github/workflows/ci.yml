name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Activate the pinned package manager
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The run tests drive the real CLI against a local file backend
      - name: Install the Pulumi CLI
        env:
          PULUMI_VERSION: 3.210.0
          PULUMI_SHA256: 4450ff72bbac9b4cb9ac28913842c9326568fe03a259d514a144a340f2a515ca
        run: |
          archive="pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://get.pulumi.com/releases/sdk/$archive"
          echo "$PULUMI_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
      # The run tests use the random provider; installing it here, with retries, keeps a flaky
      # download from failing a test
      - name: Install the random provider
        run: |
          for attempt in 1 2 3; do
            pulumi plugin install resource random v4.21.6 && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The actions run the committed bundles, and npm gets the committed dist, so both must
      # match the source
      - name: Check the built files and schema.json are up to date
        run: |
          git add --intent-to-add dist
          git diff --exit-code -- dist select/dist classify/dist plan/dist apply/dist schema.json
      - name: Show what would be published
        run: npm pack --dry-run

  # Runs the action from this commit on this repo's own pull requests and pushes, against the
  # projects in e2e/fixtures, so real event payloads and API calls are exercised
  dogfood:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        uses: ./select
      - name: Show the selection
        env:
          WAVES: ${{ steps.select.outputs.waves }}
        run: echo "Waves = $WAVES"
