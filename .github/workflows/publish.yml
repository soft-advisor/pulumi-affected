name: Publish

# Publishes the package when its package.json version isn't on npm yet, and tags the commit so
# the actions can be pinned to it. What's published is exactly the committed files: CI checks
# the committed build matches the source, and this workflow installs and runs no dependencies,
# so a compromised dev dependency can't change what reaches npm.
# Manual only until trusted publishing is set up; then add `push: branches: [main]` back
on:
  workflow_dispatch:

# Never publish twice at once
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Restricted to main in the repository settings; npm's trusted publisher names it too
    environment: release
    permissions:
      contents: write # release tags
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check the commit passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?check_name=check" --jq '.check_runs[0].conclusion')
          if [ "$conclusion" != success ]; then
            echo "::error::CI's check job hasn't passed on $GITHUB_SHA ($conclusion)"
            exit 1
          fi
      - id: version
        name: Check whether this version is new
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # The committed files, with no lifecycle scripts run
      - name: Pack
        if: steps.version.outputs.new == 'true'
        run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      # The first release uses an npm token, since npm only lets a package that exists name a
      # trusted publisher; afterwards this workflow's OIDC token signs in and the token goes
      - name: Publish
        if: steps.version.outputs.new == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.XYZ }}
        run: npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public --ignore-scripts
      - name: Tag the release and move the major version tag
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA"
          major="v${VERSION%%.*}"
          if gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA"
          fi
