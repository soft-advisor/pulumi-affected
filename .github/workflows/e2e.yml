name: E2E

# Each scenario in e2e/scenarios.json runs the whole lifecycle for real in this repository:
# deploy the fixtures, open a pull request with the scenario's change, plan it with the plan
# action from this commit, merge it, apply it with the apply action, and check the results. State lives
# in a file backend on the runner; nothing outside GitHub is touched.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      # Forks get a read-only token and can't open the test pull requests; failing (rather than
      # skipping, which required checks count as passing) keeps their pull requests unmergeable
      - name: Refuse pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Pull requests from forks can't run the end-to-end test"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: list
        run: echo "matrix=$(node e2e/driver.ts list)" >> "$GITHUB_OUTPUT"

  scenario:
    needs: scenarios
    name: ${{ matrix.scenario.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read # finding and downloading the plans' artifact
      contents: write # throwaway branches
      pull-requests: write # throwaway pull requests and their comments
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.scenarios.outputs.matrix) }}
    env:
      INDEX: ${{ matrix.scenario.index }}
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      PULUMI_CONFIG_PASSPHRASE: ''
      PULUMI_SKIP_UPDATE_CHECK: 'true'
      # Some fixtures install with yarn or pnpm through corepack
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tool
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install the Pulumi CLI
        env:
          PULUMI_VERSION: 3.210.0
          PULUMI_SHA256: 4450ff72bbac9b4cb9ac28913842c9326568fe03a259d514a144a340f2a515ca
        run: |
          archive="pulumi-v${PULUMI_VERSION}-linux-x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://get.pulumi.com/releases/sdk/$archive"
          echo "$PULUMI_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/pulumi" >> "$GITHUB_PATH"
          echo "PULUMI_BACKEND_URL=file://$RUNNER_TEMP/state" >> "$GITHUB_ENV"
          echo "FIXTURE=$RUNNER_TEMP/fixture" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/state"
      - name: Install the tool's dependencies
        working-directory: tool
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - id: prepare
        name: Deploy the fixtures and open the scenario's pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tool/e2e/driver.ts prepare "$INDEX" "$FIXTURE"

      # From here on, the steps are the README's example workflow: plan on the pull request, and
      # after merge apply exactly those plans. Select runs too, to check the selection alone.
      - id: select
        uses: ./tool/select
        with:
          base: ${{ steps.prepare.outputs.base-sha }}
          working-directory: ${{ env.FIXTURE }}
          output-file: ${{ runner.temp }}/selection.json
      - name: Check the selection
        run: node tool/e2e/driver.ts assert-select "$INDEX" "$RUNNER_TEMP/selection.json"

      - id: plan
        uses: ./tool/plan
        continue-on-error: true # one scenario fails a stack on purpose
        env:
          BANNER: ${{ steps.prepare.outputs.banner }}
        with:
          base: ${{ steps.prepare.outputs.base-sha }}
          working-directory: ${{ env.FIXTURE }}
          directory: ${{ runner.temp }}/plans
          # The wrapper prints BANNER first, as scripts that assume a role often do
          command: sh ${{ github.workspace }}/tool/e2e/wrapper.sh --cwd {dir} --stack {stack}
          pull-request: ${{ steps.prepare.outputs.pull-request }}
          retention-days: 1
      - name: Check the plans
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: node tool/e2e/driver.ts assert-plans "$INDEX" "$RUNNER_TEMP/plans"

      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.prepare.outputs.pull-request }}
          HEAD_SHA: ${{ steps.prepare.outputs.head-sha }}
        run: node tool/e2e/driver.ts merge "$INDEX" "$PULL_REQUEST" "$FIXTURE" "$HEAD_SHA"
      - name: Change a stack after planning
        run: node tool/e2e/driver.ts change-state "$INDEX" "$FIXTURE"
      # No directory: the plans come from the artifact for the merged tree, as after a merge
      - id: apply
        uses: ./tool/apply
        continue-on-error: true # planning failed, or a plan is refused, on purpose
        env:
          BANNER: ${{ steps.prepare.outputs.banner }}
        with:
          working-directory: ${{ env.FIXTURE }}
          command: sh ${{ github.workspace }}/tool/e2e/wrapper.sh --cwd {dir} --stack {stack}
          pull-request: ${{ steps.prepare.outputs.pull-request }}
      - id: reapply
        if: steps.apply.outcome == 'success'
        uses: ./tool/apply
        with:
          directory: ${{ steps.apply.outputs.directory }}
          working-directory: ${{ env.FIXTURE }}
          comment: false
      - name: Check what was applied
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          APPLY_RESULT: ${{ steps.apply.outputs.result }}
          REAPPLY_RESULT: ${{ steps.reapply.outputs.result }}
        run: node tool/e2e/driver.ts assert-apply "$INDEX"

      - name: Clean up
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ steps.prepare.outputs.pull-request }}
        run: node tool/e2e/driver.ts cleanup "$INDEX" "$PULL_REQUEST"

  # One check to require in branch rules, whatever the scenarios are called
  e2e:
    if: always()
    needs: scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All scenarios passed
        env:
          RESULT: ${{ needs.scenario.result }}
        run: |
          echo "Scenarios: $RESULT"
          [ "$RESULT" = success ]
