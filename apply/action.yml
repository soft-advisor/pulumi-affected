name: pulumi-affected apply
description: Apply exactly the Pulumi plans the plan action made for this code, without previewing again
author: soft-advisor
branding:
  icon: upload-cloud
  color: purple

# Check out the planned code first (the same git tree), and sign in to Pulumi and the cloud.
# Whether a change may be applied (approvals, branch protection) is the workflow's decision.

inputs:
  mode:
    description: >-
      plan: apply exactly the plans the plan action saved (strict). up: deploy the merged change
      with pulumi up, skipping stacks the pull request's preview (plan's mode preview) found no
      changes in. See docs/modes.md.
    required: false
    default: plan
  output-readers:
    description: >-
      Mode up: up (also deploy stacks that read outputs a deploy changed, after it) or warn (only
      list them). Default: the config's outputReaders, else up.
    required: false
  directory:
    description: >-
      A directory that already holds the plans (manifest.json). Without one, the artifact
      pulumi-plans-<tree SHA of the checkout> is downloaded to the runner's temporary folder.
    required: false
  run-id:
    description: >-
      The workflow run whose artifact to download. Default: the newest run that planned this tree
      on the pull request's head commit (or on this commit).
    required: false
  plan-sha:
    description: >-
      The commit the plan run ran on. Default: the head of the pull request this commit came
      from, or this commit. Runs on any other commit are refused, even with the same tree.
    required: false
  base:
    description: >-
      Revision the change is compared against, to check which stacks it selects. Default: the
      event's (a push's previous commit, a pull request's merge base).
    required: false
  bases:
    description: As for plan, when plan used it.
    required: false
  run:
    description: As for plan, when plan used it.
    required: false
  skip:
    description: As for plan, when plan used it.
    required: false
  force-up:
    description: >-
      Stack patterns to deploy even when the pull request's preview found no changes in them
      (like Pulumi-Affected-Force-Up lines). Mode up only: mode plan fails.
    required: false
  all:
    description: As for plan, when plan used it.
    required: false
    default: 'false'
  stacks:
    description: >-
      Stack patterns that may be applied, separated by commas or newlines. A plan for any other
      stack fails the apply before anything is applied. Default: any stack.
    required: false
  working-directory:
    description: 'A folder inside the repository. Default: the workspace.'
    required: false
  command:
    description: >-
      How to run Pulumi for a stack, as words with {dir}, {stack}, {project} and {id}
      placeholders, run without a shell; Pulumi's arguments are appended.
    required: false
    default: pulumi --cwd {dir} --stack {stack}
  concurrency:
    description: How many stacks of a wave to apply at once.
    required: false
    default: '4'
  fail-fast:
    description: Stop at the first stack that isn't applied, instead of applying every other one.
    required: false
    default: 'false'
  comment:
    description: >-
      Comment the result on the pull request: the triggering one, the pull-request input, or the
      one the pushed commit was merged from.
    required: false
    default: 'true'
  pull-request:
    description: Pull request number to comment on.
    required: false
  github-token:
    description: Token for finding and downloading the artifact (actions read) and commenting (pull-requests write).
    required: false
    default: ${{ github.token }}

outputs:
  directory:
    description: Absolute path of the plan directory.
    value: ${{ steps.apply.outputs.directory }}
  result:
    description: >-
      JSON with each stack's outcome (mode plan: applied, already-applied, refused, failed,
      skipped; mode up: applied, unchanged, failed, skipped), needsPlan, followUps and warnings.
    value: ${{ steps.apply.outputs.result }}
  needs-plan:
    description: JSON array of stacks that read outputs the apply changed and weren't deployed with them.
    value: ${{ steps.apply.outputs.needs-plan }}
  failed:
    description: "'true' when a stack wasn't applied or deployed; the action fails after commenting."
    value: ${{ steps.apply.outputs.failed }}

runs:
  using: composite
  steps:
    - id: locate
      shell: bash
      run: exec node "$GITHUB_ACTION_PATH/dist/index.cjs" locate
      env:
        INPUT_DIRECTORY: ${{ inputs.directory }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_PLAN_SHA: ${{ inputs.plan-sha }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    - if: steps.locate.outputs.download == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: ${{ steps.locate.outputs.name }}
        run-id: ${{ steps.locate.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ steps.locate.outputs.directory }}
    - id: apply
      shell: bash
      # exec, so a cancelled job's signal reaches node, which stops Pulumi cleanly
      run: exec node "$GITHUB_ACTION_PATH/dist/index.cjs" apply
      env:
        INPUT_PLANS: ${{ steps.locate.outputs.directory }}
        INPUT_STACKS: ${{ inputs.stacks }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_OUTPUT_READERS: ${{ inputs.output-readers }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_BASES: ${{ inputs.bases }}
        INPUT_RUN: ${{ inputs.run }}
        INPUT_SKIP: ${{ inputs.skip }}
        INPUT_ALL: ${{ inputs.all }}
        INPUT_FAIL_FAST: ${{ inputs.fail-fast }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_PULL_REQUEST: ${{ inputs.pull-request }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
    - if: steps.apply.outputs.failed == 'true'
      shell: bash
      run: |
        echo "::error::Not every plan was applied; see the apply step"
        exit 1
