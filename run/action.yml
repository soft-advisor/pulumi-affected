name: pulumi-affected run
description: Select the Pulumi stacks a change affects, then preview or deploy only those, in dependency order
author: soft-advisor
branding:
  icon: play
  color: purple

# Sign in to Pulumi and your cloud in earlier steps; this action only runs the command template.
inputs:
  mode:
    description: 'preview or up'
    required: true
  command:
    description: >-
      How to run Pulumi for a stack; preview or up arguments are appended. Placeholders: {dir},
      {stack}, {project}, {id}. Default: run.command in pulumi-affected.yaml, or
      "pulumi --cwd {dir} --stack {stack}".
    required: false
  concurrency:
    description: 'How many stacks run at once. Default: run.concurrency in the config, or 4.'
    required: false
  fail-fast:
    description: 'Stop starting stacks after the first failure. Default: keep going and fail at the end.'
    required: false
  pass-oidc:
    description: >-
      Let Pulumi programs and the command template request GitHub OIDC tokens. Off by default, so
      code under preview can't mint tokens your cloud's trust policies would accept.
    required: false
    default: 'false'
  comment:
    description: >-
      Comment on pull requests: the preview on the pull request, the deploy result on the pull
      requests a push merged. Needs pull-requests: write.
    required: false
    default: 'true'
  base:
    description: 'Revision to compare against. Default: from the event, like the select action.'
    required: false
  head:
    description: 'Revision to analyse. Default: the checked-out working tree.'
    required: false
  run:
    description: Stack patterns to run regardless of changes, separated by commas or newlines.
    required: false
  skip:
    description: Stack patterns to leave out unless also requested.
    required: false
  all:
    description: Run every stack.
    required: false
    default: 'false'
  pull-request:
    description: >-
      Number of a pull request to use instead of the triggering event: an open one is compared
      with its merge base, and a merged one is where a deploy reports. For workflow_dispatch and
      other events without one.
    required: false
  working-directory:
    description: 'A folder inside the repository. Default: the workspace.'
    required: false
  github-token:
    description: Token for pull request comments and /pulumi-affected commands.
    required: false
    default: ${{ github.token }}

outputs:
  results:
    description: JSON array of { id, status, reasons, counts, changedOutputs, newStack, error }; status is changes, no-changes, failed or skipped.
  changed:
    description: JSON array of the ids of stacks with changes.
  failed:
    description: JSON array of the ids of stacks that failed.
  any-changes:
    description: "'true' when at least one stack had changes."

runs:
  using: node24
  main: dist/index.cjs
